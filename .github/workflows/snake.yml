
name: Generate GitHub Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: urveebettadapur
          outputs: |
            dist/github-snake.svg?color_snake=%23800020&color_dots=%23F2E8EB,%23D9A6B5,%23B76E83,%239B2948,%234A001F
            dist/github-snake-dark.svg?color_snake=%23C18A9A&color_dots=%232B1720,%235C2638,%23800020,%23A33B59,%23D9A6B5

      - name: Push snake animation
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


<svg xmlns="http://www.w3.org/2000/svg" width="680" height="491" viewBox="0 0 680 491" role="img" aria-label="BlueJury AI project card">
  <defs>
    <linearGradient id="cardbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#B33875"/>
      <stop offset="100%" stop-color="#8F1D59"/>
    </linearGradient>
    <linearGradient id="topline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFC2D8"/>
      <stop offset="100%" stop-color="#F000A8"/>
    </linearGradient>
    <style>
      .title { font: 700 30px Arial, Helvetica, sans-serif; fill: #FFF5FA; }
      .subtitle { font: 600 17px Arial, Helvetica, sans-serif; fill: #FFE4EF; }
      .badge { font: 600 13px Arial, Helvetica, sans-serif; fill: #FFF5FA; }
      .body { font: 15px Arial, Helvetica, sans-serif; fill: #FFF5FA; }
      .eyebrow { font: 700 10px Arial, Helvetica, sans-serif; letter-spacing: 2px; fill: #FFC2D8; }
    </style>
  </defs>

  <rect x="1" y="1" width="678" height="489" rx="22" fill="url(#cardbg)" stroke="#52102F" stroke-width="2"/>
  <rect x="2" y="2" width="676" height="7" rx="4" fill="url(#topline)"/>

  <g opacity=".22" fill="none" stroke="#FFD5E5" stroke-width="1.2">
    <path d="M0 0 L110 80 L180 18 L255 92"/>
    <path d="M680 0 L590 68 L650 135"/>
    <path d="M500 0 L590 68 L535 145"/>
  </g>

  <g fill="#FFD5E5" opacity=".75">
    <circle cx="110" cy="80" r="3"/>
    <circle cx="180" cy="18" r="3"/>
    <circle cx="590" cy="68" r="3"/>
    <circle cx="650" cy="135" r="3"/>
  </g>

  <text x="32" y="42" class="eyebrow">FEATURED PROJECT</text>
  <text x="32" y="88" class="title">BlueJury AI</text>
  <text x="32" y="119" class="subtitle">Multi-Agent Decision &amp; Negotiation System</text>

  <rect x="34" y="150" width="78" height="30" rx="15" fill="#52102F" stroke="#E86AA5" stroke-width="1"/>
  <text x="73" y="170" text-anchor="middle" class="badge">Python</text>

  <rect x="122" y="150" width="84" height="30" rx="15" fill="#52102F" stroke="#E86AA5" stroke-width="1"/>
  <text x="164" y="170" text-anchor="middle" class="badge">Pydantic</text>

  <rect x="216" y="150" width="132" height="30" rx="15" fill="#52102F" stroke="#E86AA5" stroke-width="1"/>
  <text x="282" y="170" text-anchor="middle" class="badge">Multi-Agent AI</text>

  <circle cx="43" cy="209" r="4" fill="#E86AA5"/>
  <text x="60" y="215" class="body">Collaborated on a five-agent juror system helping fishermen identify</text>
  <text x="60" y="242" class="body">optimal fishing regions.</text>

  <circle cx="43" cy="276" r="4" fill="#E86AA5"/>
  <text x="60" y="282" class="body">Managed central orchestration and negotiation, coordinating concurrent</text>
  <text x="60" y="309" class="body">agent execution.</text>

  <circle cx="43" cy="343" r="4" fill="#E86AA5"/>
  <text x="60" y="349" class="body">Designed a four-stage pipeline with typed data contracts.</text>

  <circle cx="43" cy="383" r="4" fill="#E86AA5"/>
  <text x="60" y="389" class="body">Applied Pareto filtering, weighted utility, hard-veto constraints, and</text>
  <text x="60" y="416" class="body">conflict detection.</text>
</svg>
